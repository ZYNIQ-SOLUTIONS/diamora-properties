<svg width="300" height="100" viewBox="0 0 300 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="h-gold1" x1="0" y1="0" x2="300" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF5D1" />
      <stop offset="35%" stop-color="#D4AF37" />
      <stop offset="80%" stop-color="#8C6A18" />
      <stop offset="100%" stop-color="#4A370A" />
    </linearGradient>
    <linearGradient id="h-facetLeft" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E5C768" />
      <stop offset="100%" stop-color="#664D10" />
    </linearGradient>
    <linearGradient id="h-facetRight" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF0BE" />
      <stop offset="100%" stop-color="#B38F24" />
    </linearGradient>
    <filter id="h-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <g transform="translate(10, 15) scale(0.7)">
    <polygon points="50,10 90,40 50,45 10,40" fill="#0A0C10" opacity="0.8"/>
    <polygon points="50,0 0,42 0,100 50,55" fill="url(#h-facetLeft)"/>
    <polygon points="50,0 0,42 0,100 50,55" fill="#000" opacity="0.3"/> 
    <polygon points="50,0 100,42 100,100 50,55" fill="url(#h-facetRight)"/>
    <polygon points="50,0 20,22 50,45 80,22" fill="#FFFBEA"/>
    <polygon points="50,0 20,22 50,22" fill="#FFF0BE" opacity="0.7"/>
    <polygon points="50,0 80,22 50,22" fill="#FFFFFF" opacity="0.9"/>
    <polygon points="20,22 50,45 50,22" fill="#D4AF37" opacity="0.5"/>
    <polygon points="80,22 50,45 50,22" fill="#FBE6A2" opacity="0.8"/>
    <polygon points="46,43 54,43 54,100 46,100" fill="#030406"/>
    <line x1="50" y1="45" x2="50" y2="100" stroke="url(#h-gold1)" stroke-width="1" filter="url(#h-glow)"/>
    <line x1="50" y1="0" x2="0" y2="42" stroke="#FFF" stroke-width="1.5" opacity="0.6"/>
    <line x1="50" y1="0" x2="100" y2="42" stroke="#FFF" stroke-width="1.5" opacity="0.8"/>
  </g>
  <line x1="100" y1="20" x2="100" y2="80" stroke="rgba(212,175,55,0.4)" stroke-width="1.5"/>
  <text x="125" y="55" text-anchor="start" font-family="'Cinzel', serif" font-size="22" font-weight="700" fill="url(#h-gold1)" letter-spacing="4">DIAMORA</text>
  <text x="127" y="75" text-anchor="start" font-family="'Montserrat', sans-serif" font-size="8.5" font-weight="500" fill="#8C6A18" letter-spacing="4">PROPERTIES</text>
</svg>
