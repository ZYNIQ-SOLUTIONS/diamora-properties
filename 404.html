<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found | Diamora Properties</title>
  
  <!-- Favicons -->
  <link rel="icon" type="image/png" sizes="32x32" href="assets/logos/logo-preview.png">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/logos/logo-square.png">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
  <style>
    .error-page-wrapper {
      min-height: 80vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 60px 24px;
    }
    .error-code {
      font-family: var(--font-serif);
      font-size: clamp(4rem, 12vw, 8rem);
      font-weight: 700;
      line-height: 1;
      margin-bottom: 16px;
    }
    .error-heading {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 3vw, 2.2rem);
      color: var(--color-text-light);
      margin-bottom: 14px;
    }
    .error-message {
      color: var(--color-text-muted);
      max-width: 480px;
      margin-bottom: 32px;
      font-size: 1rem;
    }
    .error-actions {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
    }
  </style>
</head>
<body>
  
  <div class="error-page-wrapper container">
    <a href="/" title="Diamora Properties" style="margin-bottom: 24px;">
      <img src="assets/logos/logo-gold.png" alt="Diamora Properties Logo" width="220" height="96">
    </a>
    
    <div class="error-code gold-gradient-text">404</div>
    <h1 class="error-heading">Exclusive Location Not Found</h1>
    <p class="error-message">
      The property or page you are looking for has either been relocated or is no longer available in our public listings.
    </p>

    <div class="error-actions">
      <a href="/" class="btn-subscribe" style="padding: 14px 28px; text-decoration: none;">
        <span>Return to Homepage</span>
      </a>
      <a href="https://wa.me/971551260772" target="_blank" rel="noopener noreferrer" class="back-to-top-btn" style="padding: 14px 24px; text-decoration: none;">
        <span>WhatsApp Concierge</span>
      </a>
    </div>
  </div>

  <footer class="main-footer" style="padding-top: 30px;">
    <div class="container">
      <div class="footer-bottom-bar" style="padding-top: 0;">
        <div class="footer-copy">
          © 2026 <a href="/">Diamora Properties</a>. All rights reserved. Registered P.O. Box 92813.
        </div>
        <div class="footer-legal-links">
          <a href="/#contact" class="legal-link">Contact</a>
          <span class="legal-divider">•</span>
          <a href="mailto:info@diamora.properties" class="legal-link">info@diamora.properties</a>
        </div>
      </div>
    </div>
  </footer>

</body>
</html>
