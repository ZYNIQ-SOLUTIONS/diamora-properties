services:
  # ---------------------------------------------------------------------------
  # 1. MongoDB Database (Persistent Storage)
  # ---------------------------------------------------------------------------
  mongodb:
    image: mongo:7-jammy
    container_name: diamora_mongodb
    restart: always
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DB:-diamora}
    volumes:
      - mongodb_data:/data/db
    networks:
      - diamora_network
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.adminCommand(\"ping\").ok' --quiet | grep -q 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # 2. Node.js Express REST API
  # ---------------------------------------------------------------------------
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: diamora_api
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGO_URI: ${MONGO_URI:-mongodb://mongodb:27017/diamora}
      JWT_SECRET: ${JWT_SECRET:-diamora_super_secret_jwt_key_prod_2026}
      AUTO_SEED: ${AUTO_SEED:-true}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - diamora_network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ---------------------------------------------------------------------------
  # 3. High-Performance Nginx Web Server & Reverse Proxy
  # ---------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: diamora_web
    restart: always
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - diamora_network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

# -----------------------------------------------------------------------------
# Persistent Volumes & Networks
# -----------------------------------------------------------------------------
volumes:
  mongodb_data:
    name: diamora_mongodb_data

networks:
  diamora_network:
    name: diamora_network
    driver: bridge
