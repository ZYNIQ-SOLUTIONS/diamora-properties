services:
  # ---------------------------------------------------------------------------
  # 1. MongoDB Database (Persistent Storage)
  # ---------------------------------------------------------------------------
  mongodb:
    image: mongo:7-jammy
    container_name: diamora_mongodb
    restart: always
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DB:-diamora}
    volumes:
      - mongodb_data:/data/db
    networks:
      - diamora_network
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.adminCommand(\"ping\").ok' --quiet | grep -q 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # 2. Node.js Express REST API
  # ---------------------------------------------------------------------------
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: diamora_api
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGO_URI: ${MONGO_URI:-mongodb://mongodb:27017/diamora}
      JWT_SECRET: ${JWT_SECRET:-diamora_super_secret_jwt_key_prod_2026}
      AUTO_SEED: ${AUTO_SEED:-true}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - diamora_network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ---------------------------------------------------------------------------
  # 3. High-Performance Nginx Web Server (Internal Gateway)
  # ---------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: diamora_web
    restart: always
    volumes:
      - uploads_data:/usr/share/nginx/html/uploads
    depends_on:
      api:
        condition: service_healthy
    networks:
      - diamora_network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ---------------------------------------------------------------------------
  # 4. Caddy Edge Reverse Proxy & Automatic SSL/TLS Manager
  # ---------------------------------------------------------------------------
  caddy:
    image: caddy:2.9-alpine
    container_name: diamora_caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-157.180.26.64}
      ACME_EMAIL: ${ACME_EMAIL:-info@diamora.properties}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    networks:
      - diamora_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

# -----------------------------------------------------------------------------
# Persistent Volumes & Networks
# -----------------------------------------------------------------------------
volumes:
  mongodb_data:
    name: diamora_mongodb_data
  uploads_data:
    name: diamora_uploads_data
  caddy_data:
    name: diamora_caddy_data
  caddy_config:
    name: diamora_caddy_config

networks:
  diamora_network:
    name: diamora_network
    driver: bridge
