<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found | Diamora Properties</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/logos/favicon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/logos/logo-square.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .error-container {
      min-height: 80vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 60px 24px;
      position: relative;
      z-index: 2;
    }
    .error-code {
      font-family: var(--font-serif);
      font-size: clamp(5rem, 12vw, 9rem);
      font-weight: 700;
      line-height: 1;
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 12px;
      letter-spacing: 0.1em;
    }
    .error-title {
      font-family: var(--font-serif);
      font-size: clamp(1.4rem, 3vw, 2.2rem);
      color: var(--text-main);
      margin-bottom: 16px;
      letter-spacing: 0.05em;
    }
    .error-desc {
      color: var(--text-body);
      max-width: 480px;
      margin-bottom: 36px;
      font-size: 0.95rem;
      line-height: 1.7;
    }
    .btn-gold-home {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: var(--gold-gradient);
      color: #050608;
      padding: 14px 32px;
      border-radius: var(--radius-xs);
      font-weight: 600;
      font-size: 0.88rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      transition: transform var(--transition-fast), box-shadow var(--transition-fast), filter var(--transition-fast);
      box-shadow: var(--shadow-gold-sm);
    }
    .btn-gold-home:hover {
      filter: brightness(1.1);
      transform: translateY(-2px);
      box-shadow: var(--shadow-gold-md);
    }
  </style>
</head>
<body>
  <div class="error-container">
    <a href="index.html" style="margin-bottom: 30px; display: inline-block;">
      <img src="assets/logos/diamora-navbar-gold.png" alt="Diamora Properties" width="240" height="44">
    </a>
    <div class="error-code">404</div>
    <h1 class="error-title">Page Not Found</h1>
    <p class="error-desc">
      The property or page you are seeking is no longer active or has been moved to our private portfolio archives.
    </p>
    <a href="index.html" class="btn-gold-home">
      <span>Return to Homepage</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <line x1="5" y1="12" x2="19" y2="12"></line>
        <polyline points="12 5 19 12 12 19"></polyline>
      </svg>
    </a>
  </div>
</body>
</html>
