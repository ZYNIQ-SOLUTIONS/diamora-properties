server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Maximum client payload size (for images / payloads)
    client_max_body_size 25M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/json application/xml image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;

    # API Reverse Proxy to Node.js backend container
    location /api/ {
        proxy_pass http://api:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90s;
        proxy_connect_timeout 90s;
    }

    # Static Assets Long-Term Caching
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location /css/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, must-revalidate";
    }

    location /js/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, must-revalidate";
    }

    # Clean URL handling
    location /properties {
        try_files /properties.html $uri $uri/ =404;
    }

    location /privacy {
        try_files /privacy.html $uri $uri/ =404;
    }

    location /terms {
        try_files /terms.html $uri $uri/ =404;
    }

    location /aml {
        try_files /aml.html $uri $uri/ =404;
    }

    location /cookies {
        try_files /cookies.html $uri $uri/ =404;
    }

    location /dashboard {
        try_files /dashboard/index.html $uri $uri/ =404;
    }

    # Default file resolution
    location / {
        try_files $uri $uri/ $uri.html /index.html =404;
    }

    # Custom 404 Error Page
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
