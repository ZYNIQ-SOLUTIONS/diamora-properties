<svg width="340" height="240" viewBox="0 0 340 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="goldGradMain" x1="0" y1="0" x2="340" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF5D1" />
      <stop offset="35%" stop-color="#D4AF37" />
      <stop offset="80%" stop-color="#8C6A18" />
      <stop offset="100%" stop-color="#4A370A" />
    </linearGradient>
    <linearGradient id="facetLeft" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E5C768" />
      <stop offset="100%" stop-color="#664D10" />
    </linearGradient>
    <linearGradient id="facetRight" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF0BE" />
      <stop offset="100%" stop-color="#B38F24" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <g transform="translate(120, 20)">
    <polygon points="50,10 90,40 50,45 10,40" fill="#0A0C10" opacity="0.8"/>
    <polygon points="50,0 0,42 0,100 50,55" fill="url(#facetLeft)"/>
    <polygon points="50,0 0,42 0,100 50,55" fill="#000" opacity="0.2"/>
    <polygon points="50,0 100,42 100,100 50,55" fill="url(#facetRight)"/>
    
    <polygon points="50,0 20,22 50,45 80,22" fill="#FFFBEA"/>
    <polygon points="50,0 20,22 50,22" fill="#FFF0BE" opacity="0.7"/>
    <polygon points="50,0 80,22 50,22" fill="#FFFFFF" opacity="0.9"/>
    <polygon points="20,22 50,45 50,22" fill="#D4AF37" opacity="0.5"/>
    <polygon points="80,22 50,45 50,22" fill="#FBE6A2" opacity="0.8"/>

    <polygon points="46,43 54,43 54,105 46,105" fill="#050608"/>
    
    <line x1="50" y1="45" x2="50" y2="102" stroke="url(#goldGradMain)" stroke-width="1" filter="url(#goldGlow)"/>
    <line x1="25" y1="65" x2="25" y2="92" stroke="#FFF" stroke-width="1" opacity="0.4"/>
    <line x1="75" y1="65" x2="75" y2="92" stroke="#FFF" stroke-width="1" opacity="0.4"/>
    
    <line x1="50" y1="0" x2="0" y2="42" stroke="#FFF" stroke-width="1.5" opacity="0.6"/>
    <line x1="50" y1="0" x2="100" y2="42" stroke="#FFF" stroke-width="1.5" opacity="0.8"/>
  </g>
  
  <text x="170" y="170" text-anchor="middle" font-family="'Cinzel', serif" font-size="28" font-weight="700" fill="#050608" letter-spacing="9">DIAMORA</text>
  <text x="170" y="195" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="9" font-weight="500" fill="#8C6A18" letter-spacing="8">PROPERTIES</text>
  
  <path d="M 85 210 Q 170 205 255 210" fill="none" stroke="url(#goldGradMain)" stroke-width="0.75" opacity="0.5"/>
  <circle cx="170" cy="207.5" r="2" fill="#D4AF37" filter="url(#goldGlow)"/>
</svg>
