<svg width="300" height="90" viewBox="0 0 300 90" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="wd-gold1" x1="0" y1="0" x2="300" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF5D1" />
      <stop offset="40%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#8C6A18" />
    </linearGradient>
    <linearGradient id="wd-facetLeft" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E5C768" />
      <stop offset="100%" stop-color="#664D10" />
    </linearGradient>
    <linearGradient id="wd-facetRight" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF0BE" />
      <stop offset="100%" stop-color="#B38F24" />
    </linearGradient>
    <filter id="wd-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <g transform="translate(10, 10) scale(0.68)">
    <polygon points="50,10 90,40 50,45 10,40" fill="#0A0C10" opacity="0.8"/>
    <polygon points="50,0 0,42 0,100 50,55" fill="url(#wd-facetLeft)"/>
    <polygon points="50,0 0,42 0,100 50,55" fill="#000" opacity="0.3"/> 
    <polygon points="50,0 100,42 100,100 50,55" fill="url(#wd-facetRight)"/>
    <polygon points="50,0 20,22 50,45 80,22" fill="#FFFBEA"/>
    <polygon points="50,0 20,22 50,22" fill="#FFF0BE" opacity="0.7"/>
    <polygon points="50,0 80,22 50,22" fill="#FFFFFF" opacity="0.9"/>
    <polygon points="20,22 50,45 50,22" fill="#D4AF37" opacity="0.5"/>
    <polygon points="80,22 50,45 50,22" fill="#FBE6A2" opacity="0.8"/>
    <polygon points="46,43 54,43 54,100 46,100" fill="#030406"/>
    <line x1="50" y1="45" x2="50" y2="100" stroke="url(#wd-gold1)" stroke-width="1" filter="url(#wd-glow)"/>
    <line x1="50" y1="0" x2="0" y2="42" stroke="#FFF" stroke-width="1.5" opacity="0.7"/>
    <line x1="50" y1="0" x2="100" y2="42" stroke="#FFF" stroke-width="1.5" opacity="0.9"/>
  </g>
  <line x1="96" y1="18" x2="96" y2="72" stroke="rgba(212,175,55,0.4)" stroke-width="1.5"/>
  <text x="118" y="48" text-anchor="start" font-family="'Cinzel', serif" font-size="21" font-weight="700" fill="#FFFFFF" letter-spacing="4">DIAMORA</text>
  <text x="120" y="68" text-anchor="start" font-family="'Montserrat', sans-serif" font-size="8.5" font-weight="500" fill="url(#wd-gold1)" letter-spacing="4">PROPERTIES</text>
</svg>
